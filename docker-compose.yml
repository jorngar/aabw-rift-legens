services:
  postgres:
    image: postgres:16-alpine
    container_name: rift-seed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: rift_dev_only
      POSTGRES_DB: rift_seed
    ports:
      - "5432:5432"
    volumes:
      - rift-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift -d rift_seed"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  rift-pgdata:
