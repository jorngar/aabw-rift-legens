<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift SEED — 2.5D Isometric Action RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0612; }
    #game-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      display: flex; align-items: center; padding: 8px 16px; gap: 12px;
      z-index: 100; pointer-events: none; background: linear-gradient(180deg, rgba(10,6,18,0.9), transparent);
    }
    .bar-wrap { display: flex; align-items: center; gap: 4px; }
    .bar-wrap .label { color: #888; font-family: monospace; font-size: 10px; min-width: 20px; }
    .bar { height: 12px; border-radius: 3px; transition: width 0.2s; }
    .hp-bar { background: linear-gradient(90deg, #e74c3c, #c0392b); }
    .mp-bar { background: linear-gradient(90deg, #3498db, #2980b9); }
    .xp-bar { background: linear-gradient(90deg, #e8ff47, #a8cc00); }
    #gold-display { color: #f59e0b; font-family: monospace; font-size: 11px; margin-left: auto; }
    #rank-display { color: #a855f7; font-family: monospace; font-size: 11px; font-weight: bold; }
    #level-display { color: #e8ff47; font-family: monospace; font-size: 11px; }

    #skill-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 100;
    }
    .skill-slot {
      width: 50px; height: 50px; border: 2px solid #e8ff47; border-radius: 6px;
      background: rgba(10,6,18,0.85); display: flex; align-items: center;
      justify-content: center; font-family: monospace; font-size: 9px;
      color: #e8ff47; position: relative; flex-direction: column;
    }
    .skill-slot .key { position: absolute; top: 2px; left: 4px; font-size: 8px; color: #888; }

    #item-bar {
      position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 100;
    }
    .item-slot {
      width: 40px; height: 40px; border: 1px solid #444; border-radius: 4px;
      background: rgba(10,6,18,0.7); display: flex; align-items: center;
      justify-content: center; font-family: monospace; font-size: 8px;
      color: #aaa; position: relative;
    }
    .item-slot .key { position: absolute; top: 1px; left: 3px; font-size: 7px; color: #666; }
    .item-slot .qty { position: absolute; bottom: 1px; right: 3px; font-size: 7px; color: #e8ff47; }

    #minimap {
      position: fixed; bottom: 90px; left: 16px;
      width: 160px; height: 160px;
      border: 2px solid #e8ff47; border-radius: 4px;
      background: rgba(10,6,18,0.8); z-index: 100;
    }

    #missions {
      position: fixed; top: 50px; right: 16px;
      z-index: 100; font-family: monospace; font-size: 11px;
      pointer-events: none;
    }
    .mission-item {
      background: rgba(10,6,18,0.8); border-left: 3px solid #e8ff47;
      padding: 4px 10px; margin-bottom: 4px; color: #aaa;
      border-radius: 0 4px 4px 0;
    }
    .mission-item.complete { border-left-color: #44ff44; color: #44ff44; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="bar-wrap"><span class="label">HP</span><div class="bar hp-bar" id="hp-fill" style="width:200px"></div></div>
    <div class="bar-wrap"><span class="label">MP</span><div class="bar mp-bar" id="mp-fill" style="width:150px"></div></div>
    <div class="bar-wrap"><span class="label">XP</span><div class="bar xp-bar" id="xp-fill" style="width:100px"></div></div>
    <span id="rank-display">Rank: D</span>
    <span id="level-display">Lv.1</span>
    <span id="gold-display">⬡ 100g</span>
  </div>

  <div id="skill-bar">
    <div class="skill-slot" id="skill-q"><span class="key">Q</span>Strike</div>
    <div class="skill-slot" id="skill-w"><span class="key">W</span>Slash</div>
    <div class="skill-slot" id="skill-e"><span class="key">E</span>Heal</div>
    <div class="skill-slot" id="skill-r"><span class="key">R</span>Tele</div>
  </div>

  <div id="item-bar">
    <div class="item-slot" id="item-1"><span class="key">1</span>HP<span class="qty" id="hp-qty">0</span></div>
    <div class="item-slot" id="item-2"><span class="key">2</span>MP<span class="qty" id="mp-qty">0</span></div>
    <div class="item-slot" id="item-3"><span class="key">3</span>⟐<span class="qty" id="shard-qty">0</span></div>
  </div>

  <canvas id="minimap"></canvas>

  <div id="missions"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
