<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift SEED — 2.5D Isometric Action RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0612; }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 16px;
      z-index: 100;
      pointer-events: none;
    }
    #hud .bar { height: 20px; border-radius: 4px; min-width: 200px; }
    #hud .hp-bar { background: linear-gradient(90deg, #e74c3c, #c0392b); width: 200px; }
    #hud .mp-bar { background: linear-gradient(90deg, #3498db, #2980b9); width: 150px; }
    #hud .xp-bar { background: linear-gradient(90deg, #e8ff47, #a8cc00); width: 100px; }
    #hud .label { color: #fff; font-family: monospace; font-size: 11px; text-shadow: 1px 1px 2px #000; }
    #skill-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .skill-slot {
      width: 56px; height: 56px;
      border: 2px solid #e8ff47;
      border-radius: 6px;
      background: rgba(10,6,18,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 10px;
      color: #e8ff47;
      position: relative;
    }
    .skill-slot .key {
      position: absolute; top: 2px; left: 4px;
      font-size: 9px; color: #888;
    }
    .skill-slot .cooldown-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      transition: height 0.1s;
    }
    #agent-panel {
      position: fixed;
      top: 60px;
      right: 0;
      width: 320px;
      height: calc(100vh - 60px);
      background: rgba(10,6,18,0.92);
      border-left: 1px solid #2a2a3a;
      z-index: 90;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
      padding: 12px;
      display: none;
    }
    #agent-panel.visible { display: block; }
    #agent-panel h3 { color: #e8ff47; margin: 8px 0 4px; font-size: 13px; }
    #agent-panel .metric { display: flex; justify-content: space-between; padding: 2px 0; }
    #agent-panel .metric .value { color: #e8ff47; }
    #minimap {
      position: fixed;
      bottom: 90px;
      left: 16px;
      width: 160px;
      height: 160px;
      border: 2px solid #e8ff47;
      border-radius: 4px;
      background: rgba(10,6,18,0.8);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div>
      <span class="label">HP</span>
      <div class="bar hp-bar" id="hp-fill" style="width:200px"></div>
    </div>
    <div>
      <span class="label">MP</span>
      <div class="bar mp-bar" id="mp-fill" style="width:150px"></div>
    </div>
    <div>
      <span class="label">XP</span>
      <div class="bar xp-bar" id="xp-fill" style="width:100px"></div>
    </div>
  </div>

  <div id="skill-bar">
    <div class="skill-slot" id="skill-q"><span class="key">Q</span>Strike</div>
    <div class="skill-slot" id="skill-w"><span class="key">W</span>Slash</div>
    <div class="skill-slot" id="skill-e"><span class="key">E</span>Heal</div>
    <div class="skill-slot" id="skill-r"><span class="key">R</span>Tele</div>
  </div>

  <canvas id="minimap"></canvas>

  <div id="agent-panel">
    <h3>TELEMETRY AGENT</h3>
    <div id="telemetry-output"></div>
    <h3>A/B TESTING AGENT</h3>
    <div id="ab-output"></div>
    <h3>DATA CLEANING AGENT</h3>
    <div id="data-output"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
