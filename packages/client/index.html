<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift SEED — 2.5D Isometric Action RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0612; }
    #game-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      display: flex; align-items: center; padding: 10px 20px; gap: 14px;
      z-index: 100; pointer-events: none; background: linear-gradient(180deg, rgba(10,6,18,0.95), rgba(10,6,18,0.6), transparent);
    }
    .bar-wrap { display: flex; align-items: center; gap: 6px; }
    .bar-wrap .label { color: #fff; font-family: monospace; font-size: 12px; min-width: 24px; text-shadow: 0 0 4px rgba(0,0,0,0.8), 1px 1px 2px #000; font-weight: bold; }
    .bar { height: 14px; border-radius: 4px; transition: width 0.2s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 6px rgba(0,0,0,0.5); }
    .hp-bar { background: linear-gradient(180deg, #e74c3c, #c0392b); border: 1px solid #ff6666; }
    .mp-bar { background: linear-gradient(180deg, #3498db, #2980b9); border: 1px solid #5dade2; }
    .xp-bar { background: linear-gradient(180deg, #e8ff47, #a8cc00); border: 1px solid #e8ff47; }
    #gold-display { color: #f59e0b; font-family: monospace; font-size: 11px; margin-left: auto; }
    #rank-display { color: #a855f7; font-family: monospace; font-size: 11px; font-weight: bold; }
    #level-display { color: #e8ff47; font-family: monospace; font-size: 11px; }

    #skill-bar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100;
    }
    .skill-slot {
      width: 54px; height: 54px; border: 1px solid rgba(232,255,71,0.4); border-radius: 8px;
      background: rgba(10,6,18,0.85); display: flex; align-items: center;
      justify-content: center; font-family: monospace; font-size: 10px;
      color: #e8ff47; position: relative; flex-direction: column;
      box-shadow: 0 0 6px rgba(232,255,71,0.08), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .skill-slot .key { position: absolute; top: 3px; left: 5px; font-size: 9px; color: #e8ff47; font-weight: bold; }

    #item-bar {
      position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 100;
    }
    .item-slot {
      width: 42px; height: 42px; border: 1px solid #555; border-radius: 6px;
      background: rgba(10,6,18,0.85); display: flex; align-items: center;
      justify-content: center; font-family: monospace; font-size: 9px;
      color: #ccc; position: relative; flex-direction: column;
    }
    .item-slot .key { position: absolute; top: 2px; left: 4px; font-size: 8px; color: #aaa; font-weight: bold; }
    .item-slot .qty { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #e8ff47; font-weight: bold; }

    #minimap {
      position: fixed; bottom: 90px; left: 16px;
      width: 180px; height: 180px;
      border: 2px solid #e8ff47; border-radius: 4px;
      background: rgba(10,6,18,0.9); z-index: 100;
    }

    #missions {
      position: fixed; top: 50px; right: 16px;
      z-index: 100; font-family: monospace; font-size: 11px;
      pointer-events: none;
    }
    .mission-item {
      background: rgba(10,6,18,0.9); border-left: 3px solid #e8ff47;
      padding: 5px 12px; margin-bottom: 4px; color: #ddd;
      border-radius: 0 4px 4px 0; font-size: 12px;
      text-shadow: 1px 1px 2px #000;
    }
    .mission-item.complete { border-left-color: #44ff44; color: #44ff44; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="bar-wrap"><span class="label">HP</span><div class="bar hp-bar" id="hp-fill" style="width:200px"></div></div>
    <div class="bar-wrap"><span class="label">MP</span><div class="bar mp-bar" id="mp-fill" style="width:150px"></div></div>
    <div class="bar-wrap"><span class="label">XP</span><div class="bar xp-bar" id="xp-fill" style="width:100px"></div></div>
    <span id="rank-display">Rank: D</span>
    <span id="level-display">Lv.1</span>
    <span id="gold-display">⬡ 100g</span>
  </div>

  <div id="skill-bar">
    <div class="skill-slot" id="skill-q"><span class="key">Q</span><span style="font-size:16px;">⚔</span><span style="font-size:8px;">Strike</span></div>
    <div class="skill-slot" id="skill-e"><span class="key">E</span><span style="font-size:16px;">🌀</span><span style="font-size:8px;">Slash</span></div>
    <div class="skill-slot" id="skill-r"><span class="key">R</span><span style="font-size:16px;">💚</span><span style="font-size:8px;">Heal</span></div>
    <div class="skill-slot" id="skill-t"><span class="key">T</span><span style="font-size:16px;">◆</span><span style="font-size:8px;">Tele</span></div>
  </div>

  <div id="item-bar">
    <div class="item-slot" id="item-1"><span class="key">1</span>HP<span class="qty" id="hp-qty">0</span></div>
    <div class="item-slot" id="item-2"><span class="key">2</span>MP<span class="qty" id="mp-qty">0</span></div>
    <div class="item-slot" id="item-3"><span class="key">3</span>⟐<span class="qty" id="shard-qty">0</span></div>
  </div>

  <canvas id="minimap"></canvas>

  <div id="missions"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
